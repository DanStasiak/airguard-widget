name: Release
# A release is created when VERSION changes on main (or a v* tag is pushed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Quality checks
        shell: powershell
        run: .\tools\check.ps1
  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out version
        id: v
        run: |
          VER="$(tr -d '\r\n ' < VERSION)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          grep -q "^\$appVersion = '$VER'" src/Luftwaechter.ps1 || { echo "appVersion in Luftwaechter.ps1 does not match VERSION $VER"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then echo "Tag does not match VERSION"; exit 1; fi
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$VER already exists, nothing to do"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build package
        if: steps.v.outputs.exists == 'false'
        run: |
          VER="${{ steps.v.outputs.ver }}"
          D="Luftwaechter-$VER"
          mkdir -p "dist/$D"
          cp src/* LICENSE README.md CHANGELOG.md VERSION "dist/$D/"
          (cd dist && zip -r "../Luftwaechter-$VER.zip" "$D")
          sha256sum "Luftwaechter-$VER.zip" > SHA256SUMS.txt
          awk -v t="[$VER]" 'index($0,"## " t)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $VER" > notes.md
          {
            echo
            echo "---"
            echo "**Install (Windows 10/11):** download \`Luftwaechter-$VER.zip\` below, unzip it, double-click \`Installieren.bat\`. **Update:** press the ⟳ Update button in the widget."
            echo
            echo "**Verify the download (optional):** \`Get-FileHash .\\Luftwaechter-$VER.zip -Algorithm SHA256\` must match the line in \`SHA256SUMS.txt\`."
            echo
            echo "Using Home Assistant? The matching integration and sidebar panel: https://github.com/DanStasiak/luftwaechter-ha"
          } >> notes.md
      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.v.outputs.ver }}"
          gh release create "v$VER" "Luftwaechter-$VER.zip" SHA256SUMS.txt --target "$GITHUB_SHA" --title "Luftwaechter $VER" --notes-file notes.md
