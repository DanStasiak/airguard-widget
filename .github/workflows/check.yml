name: Checks
# Runs on every push and pull request: script syntax, versions, named controls, no secrets.
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quality checks
        shell: powershell
        run: .\tools\check.ps1
