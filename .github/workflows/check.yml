name: Checks
# Runs on every push and pull request: script syntax, versions, named controls, no secrets.
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Quality checks
        shell: powershell
        run: .\tools\check.ps1
