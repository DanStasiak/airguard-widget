name: Feature request
description: An idea to make Luftwächter better
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part does it concern?
      options: [Look and feel, Alerts and quiet hours, Rooms and sensors, Devices and switches, Updates and installer, Settings and backup, Documentation, Something else]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the widget to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What problem does it solve?
  - type: textarea
    id: setup
    attributes:
      label: Home Assistant setup, if relevant (which sensors or devices)
